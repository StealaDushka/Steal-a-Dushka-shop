<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dushka Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkXM7aHtofhx8WAT1eSfLnbsOYVXXg28o",
            authDomain: "steal-a-dushka.firebaseapp.com",
            databaseURL: "https://steal-a-dushka-default-rtdb.firebaseio.com",
            projectId: "steal-a-dushka",
            storageBucket: "steal-a-dushka.firebasestorage.app",
            messagingSenderId: "850469516444",
            appId: "1:850469516444:web:eecdf7fc938824a3f8e959",
            measurementId: "G-WK4T3127ZX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.readUserData = async function (nickname) {
            const userRef = ref(db, 'users/' + nickname);
            const snapshot = await get(userRef);
            if (snapshot.exists()) return snapshot.val();
            return null;
        };

        window.updateDushka = async function (nickname, amount) {
            const userRef = ref(db, 'users/' + nickname);
            const snapshot = await get(userRef);
            if (snapshot.exists()) {
                const data = snapshot.val();
                const newBalance = (data.dushka || 0) + amount;
                if (newBalance < 0) return false;
                await update(userRef, { dushka: newBalance });
                return true;
            }
            return false;
        };
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #balance-container {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 8px 16px;
            border-radius: 8px;
            border: 2px solid #444;
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            user-select: none;
        }

        .header {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .auth-section {
            background-color: #2c2f36;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            width: 350px;
        }

        .auth-section .nick-label { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .auth-section input {
            width: 100%;
            height: 40px;
            background-color: white;
            border: none;
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 0 10px;
            font-size: 16px;
            color: black;
            font-weight: bold;
        }

        .auth-section button {
            background-color: #4caf50;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            width: 100%;
            cursor: pointer;
        }

        .recharge-section { display: none; width: 350px; text-align: center; }

        .recharge-box {
            background-color: #2c2f36;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .info-text { color: #aaa; font-size: 14px; margin-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group input {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 18px;
            color: black;
            font-weight: bold;
            text-align: center;
        }

        .stars-result { font-size: 18px; font-weight: bold; color: #ffd700; margin: 10px 0; }
        .action-btn {
            background-color: #4caf50;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            width: 100%;
            cursor: pointer;
        }
        .action-btn:active { transform: scale(0.95); }

        #admin-notice {
            display: none;
            background: #2c2f36;
            border: 1px solid #ffd700;
            padding: 10px;
            border-radius: 8px;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #transaction-status {
            display: none;
            background: #333;
            padding: 15px;
            border-radius: 8px;
            color: #ffd700;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="balance-container">💰 <span id="balance-amount">0</span></div>

    <div class="header">💰 DUSHKA SHOP</div>

    <div class="auth-section" id="auth-section">
        <div class="nick-label">Введите ваш игровой Ник</div>
        <input type="text" id="nickname-input" placeholder="Ник (например: MrDushka)">
        <div class="nick-label">Введите ваш Пароль</div>
        <input type="password" id="password-input" placeholder="Пароль">
        <button onclick="login()">ВОЙТИ</button>
    </div>

    <div class="recharge-section" id="recharge-section">
        <div class="recharge-box">
            <div class="info-text">Введите количество Dushka Coins</div>
            <div class="input-group">
                <input type="number" id="recharge-amount" placeholder="Например: 100">
            </div>
            <div class="stars-result">Нужно звёзд: <span id="stars-needed">0</span> ⭐</div>
            <button class="action-btn" onclick="confirmRecharge()">ПОПОЛНИТЬ</button>
            <div id="transaction-status">
                ⏳ Транзакция в ожидании!<br>
                Сверните приложение и проверьте чат с ботом для оплаты.
            </div>
        </div>
    </div>

    <script>
        const tg = Telegram.WebApp;
        tg.ready();

        let currentNickname = null;
        let currentPassword = null;

        async function login() {
            const nickname = document.getElementById('nickname-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            if (!nickname || !password) { alert('Заполните Ник и Пароль!'); return; }

            const existingUser = await readUserData(nickname);
            if (existingUser) {
                if (existingUser.password === password) {
                    currentNickname = nickname;
                    currentPassword = password;
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('recharge-section').style.display = 'block';
                    document.getElementById('balance-amount').textContent = existingUser.dushka || 0;
                    alert('Вход выполнен! С возвращением, ' + nickname + '!');
                } else {
                    alert('Неверный ПАРОЛЬ!');
                }
            } else {
                alert('Данный НИК не зарегистрирован!');
            }
        }

        const rechargeInput = document.getElementById('recharge-amount');
        const starsNeededSpan = document.getElementById('stars-needed');

        rechargeInput.addEventListener('input', function() {
            const dushka = parseInt(this.value) || 0;
            const stars = Math.ceil(dushka / 10);
            starsNeededSpan.textContent = stars;
        });

        async function confirmRecharge() {
            if (!currentNickname) { alert('Сначала войдите!'); return; }

            const dushkaCoins = parseInt(document.getElementById('recharge-amount').value);
            if (!dushkaCoins || dushkaCoins <= 0) { alert('Введите корректное количество!'); return; }

            const starsNeeded = Math.ceil(dushkaCoins / 10);

            // Проверка админа
            if (currentNickname === 'MrDushka' && currentPassword === '16052014may') {
                // Админ - начисляем бесплатно
                const success = await updateDushka(currentNickname, dushkaCoins);
                if (success) {
                    const user = await readUserData(currentNickname);
                    document.getElementById('balance-amount').textContent = user.dushka || 0;
                    alert('✅ Админ! Баланс пополнен на ' + dushkaCoins + ' Dushka Coins!');
                } else {
                    alert('Ошибка начисления.');
                }
                return;
            }

            // Обычный пользователь - отправляем боту
            document.getElementById('transaction-status').style.display = 'block';

            tg.sendData(JSON.stringify({
                type: 'donation',
                nickname: currentNickname,
                dushka: dushkaCoins,
                stars: starsNeeded
            }));
        }
    </script>
</body>
</html>
