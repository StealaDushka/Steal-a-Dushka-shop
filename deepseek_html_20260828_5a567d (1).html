<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dushka Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ==================== FIREBASE ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkXM7aHtofhx8WAT1eSfLnbsOYVXXg28o",
            authDomain: "steal-a-dushka.firebaseapp.com",
            databaseURL: "https://steal-a-dushka-default-rtdb.firebaseio.com",
            projectId: "steal-a-dushka",
            storageBucket: "steal-a-dushka.firebasestorage.app",
            messagingSenderId: "850469516444",
            appId: "1:850469516444:web:eecdf7fc938824a3f8e959",
            measurementId: "G-WK4T3127ZX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.readUserData = async function (nickname) {
            const userRef = ref(db, 'users/' + nickname);
            const snapshot = await get(userRef);
            if (snapshot.exists()) return snapshot.val();
            return null;
        };

        // Списание и пополнение баланса
        window.updateBalance = async function (nickname, amount) {
            const userRef = ref(db, 'users/' + nickname);
            const snapshot = await get(userRef);
            if (snapshot.exists()) {
                const data = snapshot.val();
                const newBalance = (data.coins || 0) + amount;
                if (newBalance < 0) return false;
                await update(userRef, { coins: newBalance });
                return true;
            }
            return false;
        };
    </script>
    <!-- ==================== /FIREBASE ==================== -->

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #balance-container {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 8px 16px;
            border-radius: 8px;
            border: 2px solid #444;
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            user-select: none;
            cursor: pointer;
        }

        .header {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .auth-section {
            background-color: #2c2f36;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            width: 350px;
        }

        .auth-section .nick-label { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .auth-section input {
            width: 100%;
            height: 40px;
            background-color: white;
            border: none;
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 0 10px;
            font-size: 16px;
            color: black;
            font-weight: bold;
        }

        .auth-section button {
            background-color: #4caf50;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            width: 100%;
            cursor: pointer;
        }

        .shop-items { display: none; width: 350px; }

        .card {
            background-color: #2c2f36;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card .info { flex: 1; }
        .card .info .name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .card .info .desc { font-size: 12px; color: #aaa; }
        .card .price {
            background-color: #4caf50;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        .card .price:active { transform: scale(0.95); }

        .admin-badge {
            display: none;
            font-size: 16px;
            color: #ffd700;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Поп-ап окно для пополнения */
        #recharge-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #recharge-modal .modal-content {
            background: #2c2f36;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #444;
            width: 300px;
            text-align: center;
        }

        #recharge-modal input {
            width: 100%;
            height: 40px;
            background: white;
            border: none;
            border-radius: 8px;
            margin: 10px 0;
            padding: 0 10px;
            font-size: 16px;
            font-weight: bold;
            color: black;
        }

        #recharge-modal .actions { display: flex; gap: 10px; margin-top: 10px; }
        #recharge-modal .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        #recharge-modal .btn-confirm { background: #4caf50; color: white; }
        #recharge-modal .btn-cancel { background: #555; color: white; }
    </style>
</head>
<body>

    <!-- БАЛАНС -->
    <div id="balance-container" onclick="openRecharge()">💰 <span id="balance-amount">0</span></div>

    <!-- ЗАГОЛОВОК -->
    <div class="header">💰 DUSHKA SHOP</div>

    <!-- ВХОД -->
    <div class="auth-section" id="auth-section">
        <div class="nick-label">Введите ваш игровой Ник</div>
        <input type="text" id="nickname-input" placeholder="Ник (например: MrDushka)">

        <div class="nick-label">Введите ваш Пароль</div>
        <input type="password" id="password-input" placeholder="Пароль">

        <button onclick="login()">ВОЙТИ</button>
        <div class="admin-badge" id="admin-badge">✅ Ты Админ!</div>
    </div>

    <!-- МАГАЗИН -->
    <div class="shop-items" id="shop-items">
        <div class="card">
            <div class="info"><div class="name">VIP</div><div class="desc">Многие преимущества</div></div>
            <div class="price" onclick="buyItem('VIP', 90)">🪙 90</div>
        </div>
        <div class="card">
            <div class="info"><div class="name">2X MONEY</div><div class="desc">Двойные деньги</div></div>
            <div class="price" onclick="buyItem('2X MONEY', 50)">🪙 50</div>
        </div>
        <div class="card">
            <div class="info"><div class="name">$51,000</div><div class="desc">Деньги</div></div>
            <div class="price" onclick="buyItem('$51,000', 15)">🪙 15</div>
        </div>
        <div class="card">
            <div class="info"><div class="name">$425,000</div><div class="desc">Деньги</div></div>
            <div class="price" onclick="buyItem('$425,000', 95)">🪙 95</div>
        </div>
        <div class="card">
            <div class="info"><div class="name">Mythic</div><div class="desc">Лаки-блок</div></div>
            <div class="price" onclick="buyItem('Mythic', 44)">🪙 44</div>
        </div>
        <div class="card">
            <div class="info"><div class="name">Brainrot God</div><div class="desc">Лаки-блок</div></div>
            <div class="price" onclick="buyItem('Brainrot God', 100)">🪙 100</div>
        </div>
    </div>

    <!-- ОКНО ПОПОЛНЕНИЯ -->
    <div id="recharge-modal">
        <div class="modal-content">
            <h3 style="margin: 0 0 10px;">Пополнить баланс</h3>
            <input type="number" id="recharge-amount" placeholder="Сумма в RUB">
            <div class="actions">
                <button class="btn btn-cancel" onclick="closeRecharge()">Отмена</button>
                <button class="btn btn-confirm" onclick="confirmRecharge()">Пополнить</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== TELEGRAM WEBAPP ====================
        const tgUser = Telegram.WebApp.initDataUnsafe.user;
        let telegramNickname = tgUser ? tgUser.username : null;

        let currentNickname = null;

        // ==================== ВХОД ====================
        async function login() {
            const nickname = document.getElementById('nickname-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            if (!nickname || !password) { alert('Заполните Ник и Пароль!'); return; }

            const existingUser = await readUserData(nickname);
            if (existingUser) {
                if (existingUser.password === password) {
                    currentNickname = nickname;
                    if (nickname === 'MrDushka') document.getElementById('admin-badge').style.display = 'block';
                    document.getElementById('shop-items').style.display = 'block';
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('balance-amount').textContent = existingUser.coins || 0;
                    alert('Вход выполнен! С возвращением, ' + nickname + '!');
                } else {
                    alert('Неверный ПАРОЛЬ!');
                }
            } else {
                alert('Данный НИК не зарегистрирован!');
            }
        }

        // ==================== ОКНО ПОПОЛНЕНИЯ ====================
        function openRecharge() {
            document.getElementById('recharge-modal').style.display = 'flex';
        }

        function closeRecharge() {
            document.getElementById('recharge-modal').style.display = 'none';
        }

        // ==================== ПОДТВЕРЖДЕНИЕ ПОПОЛНЕНИЯ ====================
        async function confirmRecharge() {
            if (!currentNickname) { alert('Сначала войдите!'); return; }

            const amountRub = parseInt(document.getElementById('recharge-amount').value);
            if (!amountRub || amountRub <= 0) { alert('Введите корректную сумму!'); return; }

            // Курс: 1 RUB = 10 Dushka Coins (можешь поменять)
            const coinsToAdd = amountRub * 10;
            const success = await updateBalance(currentNickname, coinsToAdd);

            if (success) {
                const user = await readUserData(currentNickname);
                document.getElementById('balance-amount').textContent = user.coins || 0;
                alert(`✅ Баланс пополнен на ${coinsToAdd} Dushka Coins!`);
                closeRecharge();
            } else {
                alert('⚠️ Не удалось пополнить баланс!');
            }
        }

        // ==================== ПОКУПКА ЗА БАЛАНС ====================
        async function buyItem(itemName, price) {
            if (!currentNickname) { alert('Сначала войдите!'); return; }

            const success = await updateBalance(currentNickname, -price);

            if (success) {
                const user = await readUserData(currentNickname);
                document.getElementById('balance-amount').textContent = user.coins || 0;
                alert(`✅ Ты купил ${itemName}! Остаток: ${user.coins} Coins.`);
            } else {
                alert(`❌ Недостаточно средств! Нужно: ${price} Coins.`);
            }
        }
    </script>
</body>
</html>
